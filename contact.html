<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Sadiqa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="index.html">Sadiqa</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">Menu</button>
      <nav id="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="education.html">Education</a>
        <a href="skills.html">Skills</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="certifications.html">Certifications</a>
        <a href="services.html">Services</a>
        <a href="portfolio.html">My Work</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <h1>Contact</h1>
      <p>Send me a message.</p>
    </section>
    <section class="block two-col">
      <div>
        <h2>My details</h2>
        <p>Email: <span class="ph">[your-email@example.com]</span></p>
        <p>Phone: <span class="ph">[your phone number]</span></p>
        <p>Location: <span class="ph">[your city and country]</span></p>
        <p>Social media: <span class="ph">[your link]</span></p>
      </div>
      <form id="contactForm">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" required>
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button class="btn primary" type="submit">Send message</button>
        <p id="formNote" class="note"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Sadiqa. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
